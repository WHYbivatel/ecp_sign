name: CI

# Synthetic keys and local replicas only. Network checks of TSA/OCSP/CRL and real portals run
# separately (tests/tsp-live.mjs, tests/revocation-live.mjs, manual portal scenarios).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in unit-macos: a macOS runner that is not acquired must not block the jobs below.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: OpenSSL 3 first in PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"; fi
          # Windows: the first OpenSSL 3 that ships the legacy provider (needed for -legacy PKCS#12 fixtures).
          if [ "$RUNNER_OS" = Windows ]; then
            for dir in "/c/Program Files/OpenSSL" "/c/Program Files/Git/mingw64"; do
              module=$(find "$dir" -iname legacy.dll 2>/dev/null | head -1)
              if [ -n "$module" ] && [ -x "$dir/bin/openssl.exe" ]; then
                cygpath -w "$dir/bin" >> "$GITHUB_PATH"
                echo "OPENSSL_MODULES=$(cygpath -w "$(dirname "$module")")" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
      - name: Environment
        shell: bash
        run: |
          node -p '`node ${process.version} ${process.platform} ${process.arch}`'
          openssl version
          openssl list -providers -provider legacy -provider default || true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Release metadata
        run: node website/scripts/check-releases.mjs
      - name: Bundled NCA certificates (offline)
        run: node scripts/check-trust.mjs

  unit-macos:
    name: unit · macos-latest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: OpenSSL 3 first in PATH
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build

  issuance-browsers:
    name: issuance E2E · ${{ matrix.browser }} · ${{ matrix.os }}
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, browser: chrome }
          - { os: windows-latest, browser: msedge }
          - { os: macos-latest, browser: chrome }
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: chromium }
          - { os: windows-latest, browser: firefox }
          - { os: macos-latest, browser: firefox }
          - { os: ubuntu-latest, browser: firefox }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TEGIN_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: OpenSSL 3 first in PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"; fi
          # Windows: the first OpenSSL 3 that ships the legacy provider (needed for -legacy PKCS#12 fixtures).
          if [ "$RUNNER_OS" = Windows ]; then
            for dir in "/c/Program Files/OpenSSL" "/c/Program Files/Git/mingw64"; do
              module=$(find "$dir" -iname legacy.dll 2>/dev/null | head -1)
              if [ -n "$module" ] && [ -x "$dir/bin/openssl.exe" ]; then
                cygpath -w "$dir/bin" >> "$GITHUB_PATH"
                echo "OPENSSL_MODULES=$(cygpath -w "$(dirname "$module")")" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
      - run: npm ci
      - name: Browser
        shell: bash
        run: |
          if [ "$TEGIN_BROWSER" = chromium ]; then npx playwright install --with-deps chromium; fi
          if [ "$TEGIN_BROWSER" = msedge ]; then npx playwright install msedge || true; fi
          if [ "$TEGIN_BROWSER" = chrome ]; then npx playwright install chrome || true; fi
      - name: Firefox stable cache
        if: matrix.browser == 'firefox'
        uses: actions/cache@v4
        with:
          path: .browsers
          key: firefox-stable-${{ runner.os }}-${{ runner.arch }}
      - name: Kalkan jars (official NCALayer archive, pinned SHA-256)
        id: kalkan
        uses: actions/cache@v4
        with:
          path: .kalkan
          key: kalkan-0.7.8-5588f9ae-72c273d3
      - name: Independent verifier
        shell: bash
        run: echo "NCA_KALKAN_JARS=$(node scripts/fetch-kalkan.mjs .kalkan)" >> "$GITHUB_ENV"
      - name: Issuance, installation, reopen .p12, signature checked by Kalkan
        shell: bash
        run: |
          if [ "$TEGIN_BROWSER" = firefox ]; then node tests/e2e-issuance-firefox.mjs; else node tests/e2e-issuance.mjs; fi
      - name: Password change of Kalkan-created keys, checked by Kalkan
        if: matrix.browser == 'chromium'
        run: node tests/kalkan-password.mjs
      - name: Revocation (OCSP, CRL fallback) in Firefox through a local test proxy
        if: matrix.browser == 'firefox'
        run: node tests/e2e-revocation-firefox.mjs
      - name: Password change tool in Firefox, copies checked by Kalkan
        if: matrix.browser == 'firefox'
        run: node tests/e2e-password-firefox.mjs
      - name: Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issuance-${{ matrix.browser }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore

  token-host:
    name: token host prototype · SoftHSM2 · ubuntu
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends softhsm2 opensc python3-pykcs11
      - run: npm ci
      # Software PKCS#11 token as a stand-in: protocol, PIN, cancel, removal; no physical device.
      - run: node tests/token-softhsm.mjs

  xml-official:
    name: XML against official NCALayer code · ubuntu
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Kalkan, knca_provider_util and slf4j (official NCALayer archive, pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: .kalkan
          key: kalkan-xml-0.7.8-5588f9ae-72c273d3-613e8ecf-49c4af31-current-6bb88c85-a7defbfb
      - run: node scripts/fetch-kalkan.mjs .kalkan --xml >> "$GITHUB_ENV"
      # Kalkan XMLDSig: CMS/CAdES, whole-document and XPath XML, co-signatures, portal payloads.
      - run: node tests/kalkan-crosscheck.mjs
      # XMLUtil.verifyXmlSignature: NURSign xml contract, XPath co-signing RSA + GOST-512.
      - run: node tests/nursign-xml-crosscheck.mjs
      # An installed NCALayer updates itself to the versions in the signed catalog (XMLDSig 0.5.2, util 0.9.2).
      - name: The same against the bundles an installed NCALayer updates to
        run: |
          set -a; eval "$(node scripts/fetch-kalkan.mjs .kalkan --current)"; set +a
          node tests/kalkan-crosscheck.mjs
          node tests/nursign-xml-crosscheck.mjs

  package:
    name: packaged archives · ubuntu
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run package
      - name: Archives checked as shipped; Chromium archive loaded unpacked
        run: node scripts/verify-package.mjs --smoke
      - name: Firefox archive through the AMO validator
        run: npx --yes addons-linter@10.15.0 dist/tegin-firefox-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tegin-packages-${{ github.sha }}
          path: |
            dist/tegin-*.zip
            dist/checksums.json
          retention-days: 14

  full-e2e-linux:
    name: full E2E · chromium · ubuntu
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e
          path: artifacts/
          if-no-files-found: ignore
