<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Synthetic NUC application · step 3</title></head><body>
<!-- Anonymized replica of did.pki.gov.kz /service/pkiorder/create.xhtml, step 3: the hidden
     fields read by /js/pkiorder-basics.js (sha256 c7b87ab1…) and its createCertRequest() with
     jQuery replaced by DOM calls. Synthetic values only. -->
<h1>Подача онлайн-заявки (генерация ключевой пары)</h1>
<span id="validPreCreate" hidden>true</span>
<span id="hiddenAllowedStorages" hidden>{{STORAGES}}</span>
<span id="certrequestCount" hidden>1</span>
<span id="oidStr" hidden>2.5.4.3<:>2.5.4.4<:>2.5.4.5<:>2.5.4.6<:>2.5.4.42<:>2.5.4.10<:>2.5.4.11</span>
<span id="valueStr" hidden>ТЕСТОВ ТЕСТ<:>ТЕСТОВ<:>IIN000000000000<:>KZ<:>ТЕСТҰЛЫ<:>ТОО «ҚАЗАҚ СИНТЕТИКА»<:>BIN000000000000</span>
<span id="sanStr" hidden></span>
<span id="isEmailInDNList" hidden>false</span>
<span id="emailStr" hidden></span>
<span id="pkcs12DefaultPassword" hidden>synthetic-default</span>
<input id="isCustomPKCS12Password" type="hidden" value="false">
<span id="omittedKeyIds" hidden></span>
<span id="genKeyHiddenParams:0:algorithm" hidden>1.2.398.3.10.1.1.2.3.2</span>
<span id="genKeyHiddenParams:0:publicKeylength" hidden>512</span>
<!-- The JSF form posts certrequestStr, the clicked submitOrderBTest and javax.faces.ViewState (observed). -->
<form id="createForm" method="post" action="/service/pkiorder/create.xhtml" enctype="application/x-www-form-urlencoded">
<input type="hidden" name="createForm" value="createForm">
<textarea id="certrequestStr" name="certrequestStr" hidden></textarea>
<input type="hidden" id="storagePath" name="storagePath" value="">
<input type="hidden" name="javax.faces.ViewState" value="synthetic-view-state:1">
<input type="submit" id="submitOrderBTest" name="submitOrderBTest" value="Отправить" hidden>
</form>
<script>
var SOCKET_URL = 'wss://127.0.0.1:13579/';
var locale = 'ru';
var certRequestSubmitted = false;
var text = function (id) { return document.getElementById(id).textContent; };
window.alerts = [];
window.alert = function (code) { window.alerts.push(code); };
function unblockScreen() { window.unblocked = (window.unblocked || 0) + 1; }
function connect() {
  if (connect.webSocket && connect.webSocket.readyState < 2) return Promise.resolve(connect.webSocket);
  return new Promise(function (resolve, reject) {
    connect.webSocket = new WebSocket(SOCKET_URL);
    connect.webSocket.onopen = function () { resolve(connect.webSocket); };
    connect.webSocket.onerror = function (err) { unblockScreen(); reject(err); };
  });
}
async function createCertRequest() {
  if (certRequestSubmitted) return;
  if (text('validPreCreate') === 'false') return;
  var allowedStoragesArr = text('hiddenAllowedStorages').split(',');
  var requestCount = parseInt(text('certrequestCount'));
  var oidStrArr = text('oidStr').split('<:>');
  var valueStrArr = text('valueStr').split('<:>');
  var sanStrArr = '';
  if (text('sanStr')) sanStrArr = text('sanStr').split(',');
  var emailStr;
  if (text('isEmailInDNList') === 'false') emailStr = text('emailStr');
  var pkcs12DefaultPassword = text('pkcs12DefaultPassword');
  var omittedKeyIdsArr = text('omittedKeyIds').split('<:>');
  var paramsArray = [];
  for (var i = 0; i < requestCount; i++) {
    paramsArray.push({ algorithm: text('genKeyHiddenParams:' + i + ':algorithm'), length: parseInt(text('genKeyHiddenParams:' + i + ':publicKeylength')) });
  }
  var dn = {};
  oidStrArr.forEach(function (item, index) { dn[item] = valueStrArr[index]; });
  var certRequestInfo = { module: 'kz.gov.pki.knca.basics', method: 'generateCsr', class: 'PKIEssentials',
    args: { allowedStorages: allowedStoragesArr, defaultPassword: pkcs12DefaultPassword, dn: dn, email: emailStr, subjectAltNames: sanStrArr, params: paramsArray, locale: locale, omittedKeyIds: omittedKeyIdsArr } };
  if (allowedStoragesArr.length == 0) delete certRequestInfo.args.allowedStorages;
  return connect().then(function (webSocket) {
    if (certRequestSubmitted) return;
    webSocket.send(JSON.stringify(certRequestInfo));
    return new Promise(function (resolve) {
      webSocket.onmessage = function (event) {
        var response = JSON.parse(event.data);
        if (response != null) {
          if (response.status === true) {
            var body = response.body;
            if (body != null) {
              // pkiorder-basics.js: $('storagePath') is a tag selector and matches no form field.
              if (body.hasOwnProperty('container')) document.querySelectorAll('storagePath').forEach(function (node) { node.value = body.container; });
              if (body.hasOwnProperty('pems')) {
                document.getElementById('certrequestStr').value = body.pems.join('<:>');
                certRequestSubmitted = true;
                webSocket.onmessage = null; webSocket.onclose = null; webSocket.onerror = null;
                webSocket.close();
                document.getElementById('submitOrderBTest').click();
              } else unblockScreen();
            }
          } else if (response.status === false) { unblockScreen(); alert(response.code); }
        }
        resolve(response);
      };
    });
  }).catch(function (err) { unblockScreen(); });
}
</script>
<iframe id="frame" src="about:blank" hidden></iframe>
</body></html>
